version: '3.8'

# ============================================================
# PLA - Personalised Learning Assistant
# Complete Docker Stack for Development & Production
# ============================================================

services:

  # ==========================================
  # BACKEND API
  # ==========================================
  backend:
    build:
      context: ./pla-backend
      dockerfile: Dockerfile
      target: production
    container_name: pla-backend
    ports:
      - "5000:5000"
    env_file:
      - ./pla-backend/.env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: pla_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      MONGO_URI: mongodb://mongodb:27017/pla_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pla-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M

  # ==========================================
  # POSTGRESQL DATABASE
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: pla-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: pla_db
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./pla_db.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "5432:5432"
    networks:
      - pla-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d pla_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  # ==========================================
  # MONGODB
  # ==========================================
  mongodb:
    image: mongo:7
    container_name: pla-mongodb
    environment:
      MONGO_INITDB_DATABASE: pla_db
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - pla-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ==========================================
  # REDIS (Caching + Rate Limiting)
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: pla-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - pla-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  # ==========================================
  # PROMETHEUS (Metrics Collection)
  # ==========================================
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: pla-prometheus
    volumes:
      - ./pla-backend/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./pla-backend/monitoring/prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - pla-network
    restart: unless-stopped
    depends_on:
      - backend

  # ==========================================
  # GRAFANA (Dashboards & Monitoring)
  # ==========================================
  grafana:
    image: grafana/grafana:10.2.0
    container_name: pla-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin123}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ALERTING_ENABLED: "true"
      GF_INSTALL_PLUGINS: "grafana-clock-panel,grafana-piechart-panel"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./pla-backend/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./pla-backend/monitoring/grafana/dashboard.json:/var/lib/grafana/dashboards/pla-dashboard.json:ro
    ports:
      - "3001:3000"
    networks:
      - pla-network
    restart: unless-stopped
    depends_on:
      - prometheus

  # ==========================================
  # NODE EXPORTER (System Metrics)
  # ==========================================
  node-exporter:
    image: prom/node-exporter:v1.6.1
    container_name: pla-node-exporter
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "9100:9100"
    networks:
      - pla-network
    restart: unless-stopped

  # ==========================================
  # CADVISOR (Container Metrics)
  # ==========================================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: pla-cadvisor
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8080:8080"
    networks:
      - pla-network
    restart: unless-stopped

  # ==========================================
  # ALERTMANAGER (Alerting)
  # ==========================================
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: pla-alertmanager
    volumes:
      - ./pla-backend/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    ports:
      - "9093:9093"
    networks:
      - pla-network
    restart: unless-stopped

  # ==========================================
  # WEB APPLICATION (Development Mode)
  # ==========================================
  web:
    build:
      context: ./pla-webApp
      dockerfile: Dockerfile
    container_name: pla-web
    environment:
      REACT_APP_API_URL: /api
      NODE_ENV: development
    ports:
      - "3000:3000"
    volumes:
      - ./pla-webApp:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - pla-network
    restart: unless-stopped

# ==========================================
# NETWORKS
# ==========================================
networks:
  pla-network:
    name: pla-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ==========================================
# VOLUMES
# ==========================================
volumes:
  postgres_data:
    name: pla_postgres_data
  mongodb_data:
    name: pla_mongodb_data
  redis_data:
    name: pla_redis_data
  prometheus_data:
    name: pla_prometheus_data
  grafana_data:
    name: pla_grafana_data
  alertmanager_data:
    name: pla_alertmanager_data