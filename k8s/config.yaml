apiVersion: v1
kind: ConfigMap
metadata:
  name: pla-config
data:
  postgres_host: "postgres.default.svc.cluster.local"
  postgres_port: "5432"
  postgres_db: "pla_db"
  redis_host: "redis.default.svc.cluster.local"
  redis_port: "6379"
  mongo_uri: "mongodb://mongodb.default.svc.cluster.local:27017/pla_db"
  log_level: "info"
  node_env: "production"
---
apiVersion: v1
kind: Secret
metadata:
  name: pla-secrets
type: Opaque
stringData:
  jwt_secret: "CHANGE_ME_IN_PRODUCTION_WITH_SECURE_VALUE"
  session_secret: "CHANGE_ME_IN_PRODUCTION_WITH_SECURE_VALUE"
  postgres_user: "postgres"
  postgres_password: "CHANGE_ME_IN_PRODUCTION"
  sentry_dsn: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: pla-registry-secret
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: BASE64_ENCODED_DOCKER_CONFIG